name: pipeline

# Runs on a schedule, on demand, and whenever new media is dropped into inbox/.
on:
  schedule:
    # 06:17 UTC daily - off the hour, so this does not pile onto every other
    # scheduled workflow on GitHub's shared runner fleet.
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "inbox/**"
      - "amn/**"
      - "pyproject.toml"
      - ".github/workflows/pipeline.yml"

permissions:
  contents: write

concurrency:
  group: amn-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -e .

      - name: Vet and watermark
        id: vet
        env:
          AMN_WATERMARK_TEXT: ${{ vars.AMN_WATERMARK_TEXT }}
        run: |
          set +e
          python -m amn.pipeline run --root .
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      # Publishing is irreversible: a post cannot be un-shared, only deleted.
      # Off unless AMN_PUBLISH is explicitly enabled.
      - name: Publish to Bluesky
        if: steps.vet.outputs.exit_code == '0' && vars.AMN_PUBLISH == 'true'
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: |
          if [ -z "$BLUESKY_HANDLE" ] || [ -z "$BLUESKY_APP_PASSWORD" ]; then
            echo "::warning::AMN_PUBLISH is on but BLUESKY_HANDLE/BLUESKY_APP_PASSWORD are unset, skipping"
            exit 0
          fi
          pip install -e ".[bluesky]"
          set +e
          python -m amn.pipeline publish --platform bluesky --root .
          echo "publish_exit=$?" >> "$GITHUB_OUTPUT"

      # Telegram publishing is independently opt-in. The bot credentials are
      # mapped explicitly from repository secrets; merely creating a secret does
      # not expose it to this workflow.
      - name: Publish to Telegram
        if: steps.vet.outputs.exit_code == '0' && vars.AMN_TELEGRAM_PUBLISH == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::error::AMN_TELEGRAM_PUBLISH is on but TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID are unset"
            exit 1
          fi
          python -m amn.pipeline publish --platform telegram --root .

      - name: Commit results
        run: |
          git config user.name "amn-bot"
          git config user.email "amn-bot@users.noreply.github.com"
          set +e  # keep going even if no changes to stage
          git add inbox || true
          for dir in build outbox rejected; do
            if [ -d "${dir}" ] && [ "$(ls -A ${dir} 2>/dev/null)" ]; then
              git add "${dir}" || true
            fi
          done
          if git diff --staged --quiet; then
            echo "nothing to commit"
          else
            git commit -m "chore(pipeline): run at $(date -u +%Y-%m-%dT%H:%M:%SZ)" || true
            git push || echo "::warning::could not push results"
          fi

      - name: Fail if vet had errors
        if: always() && steps.vet.outputs.exit_code != '0'
        run: |
          echo "::error::vet exited with ${{ steps.vet.outputs.exit_code }}, see manifest"
          exit ${{ steps.vet.outputs.exit_code }}

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manifest-${{ github.run_number }}
          path: build/manifest.json
          if-no-files-found: ignore
          retention-days: 30