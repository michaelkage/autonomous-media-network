[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-media-network"
version = "0.2.0"
description = "Local-first, multi-source and multi-platform media distribution pipeline."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pillow>=10.1", "requests>=2.31"]

[project.optional-dependencies]
bluesky = ["atproto>=0.1.0"]
dashboard = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
dev = ["pytest>=8.0", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
amn = "amn.pipeline:main"
amn-dashboard = "amn.dashboard:main"

[tool.setuptools.packages.find]
include = ["amn*"]

[tool.setuptools.package-data]
amn = ["dashboard.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.amn]
min_width = 1080
min_height = 1080
min_likes = 500
min_engagement_rate = 0.02
allowed_formats = ["JPEG", "PNG", "WEBP"]
max_distance = 5
